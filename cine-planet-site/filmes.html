<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filme | Cine-Planet</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="filme-detalhe">
  <header class="navbar">
    <a class="logo" href="/#filmes">CINE-PLANET</a>
    <nav><a href="/#filmes">Filmes</a><a href="/#sobre">Sobre</a></nav>
  </header>

  <main>
    <section>
      <p id="aviso">Carregando filme...</p>
      <article id="detalhe" class="detalhe" hidden></article>
    </section>
  </main>

  <footer>© 2026 Cine-Planet · Poá, São Paulo</footer>

  <script>
    const esc = t => String(t ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt()};`)
    const aviso = document.querySelector("#aviso")
    const detalhe = document.querySelector("#detalhe")
    const id = new URLSearchParams(location.search).get("id")

    if (!id || !/^\d+$/.test(id)) {
      aviso.textContent = "Filme não encontrado."
    } else {
      fetch(`/api/filmes/${encodeURIComponent(id)}`).then(r => {
        if (!r.ok) throw new Error("Filme não encontrado")
        return r.json()
      }).then(f => {
        document.title = `${f.titulo} | Cine-Planet`
        detalhe.innerHTML = `
          ${f.imagem ? `<img src="${esc(f.imagem)}" alt="Cartaz de ${esc(f.titulo)}">` : ""}
          <div>
            <h1>${esc(f.titulo)}</h1>
            <p class="ouro">${esc(f.generos)} · ${esc(f.duracao)}</p>
            <p><b>Ano</b> ${esc(f.ano || "Não informado")}</p>
            <p><b>Direção</b> ${esc(f.diretor || "Não informado")}</p>
            <p><b>Classificação</b> ${esc(f.classificacao || "Não informada")}</p>
            <p class="sinopse">${esc(f.sinopse)}</p>
            <a class="voltar" href="/">Voltar aos filmes</a>
          </div>`
        aviso.hidden = true
        detalhe.hidden = false
      }).catch(() => aviso.textContent = "Não foi possível carregar esse filme.")
    }
  </script>
</body>
</html>
